# Anaglyfin CI test job.
#
# Usage (from any checkout of this repository):
#   SRC_DIR="$HOST_WORKSPACE/Anaglyfin/.worktrees/agent-T0" docker compose -f .ci/test.yml run --rm test
#
# SRC_DIR is the only required parameter: it is used both as the Docker build
# context and as the bind mount the job builds and tests. No path of the caller's
# repository is hardcoded here (inside the container it is always /src).
# Optional: ANAGLYFIN_CI_TAG (image tag, default "local"), BUILD_CONTEXT (see
# below), BUILD_UID / BUILD_GID (toolchain image user).
name: anaglyfin-ci

services:
  test:
    build:
      # Build context is read by the compose CLI, the bind mount by the daemon.
      # Those are the same path on a normal host, so SRC_DIR alone is enough.
      # BUILD_CONTEXT only exists for setups where the CLI and the daemon see the
      # workspace under different mount points (agent containers vs. host); leave
      # it unset everywhere else.
      context: ${BUILD_CONTEXT:-${SRC_DIR:?SRC_DIR must point at the checkout to test}}
      dockerfile: .ci/Dockerfile
      tags:
        - anaglyfin-ci:${ANAGLYFIN_CI_TAG:-local}
    image: anaglyfin-ci:${ANAGLYFIN_CI_TAG:-local}
    # Build, restore and test are pure host-network-free work: the job never
    # listens on a port and never talks to another container. Using the host
    # network namespace keeps the gate independent of the daemon's bridge
    # address pools (this host currently refuses new custom networks).
    network_mode: host
    working_dir: /src
    volumes:
      - ${SRC_DIR:?SRC_DIR must point at the checkout to test}:/src
    environment:
      # Scratch space for this job (test results, transient fixtures).
      ANAGLYFIN_TEST_TMPDIR: /tmp/anaglyfin-test
      # Port reserved for the future Jellyfin integration job. Nothing in the
      # scaffold listens on it, so it is exported as metadata only and is not
      # published. No database is used by this job.
      ANAGLYFIN_TEST_PORT: "8098"
      ANAGLYFIN_TEST_DB: none
    command:
      - /bin/sh
      - -e
      - -c
      - |
        set -x
        mkdir -p /tmp/anaglyfin-test
        dotnet restore Anaglyfin.sln
        dotnet build Anaglyfin.sln --configuration Release --no-restore -warnaserror
        dotnet test tests/Anaglyfin.Tests/Anaglyfin.Tests.csproj --configuration Release --no-build --results-directory /tmp/anaglyfin-test/TestResults
        dotnet format whitespace Anaglyfin.sln --no-restore --verify-no-changes

        # Packaging, after the gate every branch already has to pass. The wrapper
        # is published before the archive is written so that the plugin zip holds
        # the plain Release build the tests just ran, and nothing rebuilds under
        # the packaging step. Both publish outputs land under bin/ (ignored), the
        # installable artifacts under artifacts/ (ignored).
        dotnet publish src/Anaglyfin.FFmpegWrapper/Anaglyfin.FFmpegWrapper.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishSingleFile=true
        dotnet publish src/Anaglyfin.FFmpegWrapper/Anaglyfin.FFmpegWrapper.csproj --configuration Release
        test -f src/Anaglyfin.FFmpegWrapper/bin/Release/net10.0/linux-x64/publish/Anaglyfin.FFmpegWrapper
        test -f src/Anaglyfin.FFmpegWrapper/bin/Release/net10.0/publish/Anaglyfin.FFmpegWrapper.dll

        # pack writes artifacts/<name>_<version>.zip with <name>.dll at the archive
        # root, stages the wrapper as artifacts/anaglyfin-ffmpeg, emits meta.json
        # from the manifest, and verifies what it wrote. verify then judges the
        # directory knowing only the manifest: archive layout, every metadata field,
        # the recorded size and checksum, and the wrapper's ELF header. A refusal is
        # a non-zero exit here, not a note in the log.
        dotnet run --project tools/Anaglyfin.Packager --configuration Release --no-build -- pack --plugin-dll src/Anaglyfin/bin/Release/net10.0/Anaglyfin.dll --manifest src/Anaglyfin/Plugin.manifest.xml --output artifacts --wrapper-input src/Anaglyfin.FFmpegWrapper/bin/Release/net10.0/linux-x64/publish/Anaglyfin.FFmpegWrapper
        dotnet run --project tools/Anaglyfin.Packager --configuration Release --no-build -- verify --manifest src/Anaglyfin/Plugin.manifest.xml --artifacts artifacts --wrapper-file anaglyfin-ffmpeg

        set +x
        echo "anaglyfin CI gate: restore + build(-warnaserror) + test + format + packaging all passed"
